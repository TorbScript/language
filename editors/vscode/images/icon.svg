  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1E1E1E"/>
  <rect x="56" y="64" width="144" height="32" rx="8" fill="#4EC9B0"/>
  <rect x="112" y="64" width="32" height="136" rx="8" fill="#4EC9B0"/>
  <rect x="152" y="168" width="48" height="32" rx="8" fill="#DCDCAA"/>
</svg>
