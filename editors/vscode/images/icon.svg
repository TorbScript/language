<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER icon of the TorbScript extension, until the brand round delivers the real one.
  images/icon.png is rendered from this file (256 x 256) and is what package.json's "icon" names - the stores take a
  PNG only. Replace both files together: the real icon's SVG here, its 256 x 256 PNG as icon.png.
-->
