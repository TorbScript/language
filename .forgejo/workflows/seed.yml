# Publishes the seed of main without a release: Actions -> seed -> Run workflow, on main.
#
# This is the CI half of the two-commit rule (compiler/CONTRIBUTING.md, "Two commits for a breaking change"): the
# first commit teaches the compiler both forms, this workflow publishes the seed built from it, and only then can the
# second commit, which uses the new form, bootstrap anywhere - in CI and in every fresh clone. The nightly publishes a
# seed as well, so a breaking change that can wait a day needs nothing but the nightly.
#
# The seed is packed only when linux-x64 bootstraps (the fixpoint) and passes tier A and tier B. The other targets are
# not needed for it: a seed is C, and the C is the same on every host (gates.yml, `agree`). Publishing asks the forge
# for a token of the Authorized Integration whose audience is TORB_PUBLISH_AUDIENCE (.forgejo/actions/token).
name: seed

on:
  workflow_dispatch:

concurrency:
  group: seeds
  cancel-in-progress: false

jobs:
  gates:
    if: forgejo.ref == 'refs/heads/main'
    uses: ./.forgejo/workflows/gates.yml
    with:
      tier-b: true
      seed: true

  publish:
    name: publish the seed
    needs: gates
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: seed
          path: seed-archive
      - id: token
        uses: ./.forgejo/actions/token
        with:
          audience: ${{ vars.TORB_PUBLISH_AUDIENCE }}
          variable: TORB_PUBLISH_AUDIENCE
      - name: sh tools/publish-seed.sh
        env:
          TORB_FORGE_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          for archive in seed-archive/torb-seed-*.tar.gz; do
            sh tools/publish-seed.sh "$archive"
          done
