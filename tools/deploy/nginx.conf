# The read side of torb.dev and packages.torb.dev (tools/deploy/Dockerfile.site). Traefik terminates TLS in front of
# this and forwards both host names here with their Host field, which picks the server block: torb.dev is the site
# and the downloads, packages.torb.dev the registry's files (docs/design/RELEASE.md sections 7.4 and 7.11). A CDN in
# front caches by the Cache-Control each location sets.

# Every redirect this answers - `/` below, and the slash nginx adds to a directory (`/download/latest` ->
# `/download/latest/`) - names only the path: behind the TLS-terminating Traefik this server listens on plain HTTP,
# and an absolute Location would send the browser to http://torb.dev/..., one more hop at best and a downgrade at worst.
absolute_redirect off;

# torb.dev, and whatever else reaches this container without a known name
server {
  listen 80 default_server;
  server_name torb.dev www.torb.dev;
  root /usr/share/nginx/html;

  # The website `torb docs site` writes (docs/design/RELEASE.md section 6): a path without `.html` finds its page -
  # /install is install.html, /docs/0.2.0/guide/values-and-bindings its .html - and a directory its index.html
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain font/ttf;

  # A top-level page is written flat (install.html, play.html, imprint.html, privacy.html - never name/index.html),
  # so its trailing-slash form has no directory to fall into and 404s (/play/ where /play and /play.html work). The
  # language prefix, if any, is kept: /de/play/ -> /de/play. Named explicitly, so this never reaches a real
  # directory such as /docs/ or /assets/.
  location ~ "^/(?<pageLanguage>[a-z]{2}/)?(?<pageName>install|play|imprint|privacy)/$" {
    return 301 /$pageLanguage$pageName;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "public, max-age=300";
  }

  # The stylesheet and the script are asked for with a hash of their content behind `?v=`, and so is the playground
  # (docs/tooling/the-playground.md): the site's script loads assets/playground.js with a hash of its files, and
  # it loads the rest with the same. A font never changes under its name. So a browser keeps them for a year. The
  # playground's `torb.wasm` (12 MB) is sent as the `torb.wasm.gz` beside it (4 MB), gzipped once when it was built
  # rather than on every request
  location /assets/ {
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000";
  }
  location = /manifest.webmanifest {
    default_type "application/manifest+json";
    add_header Cache-Control "public, max-age=86400";
  }

  location = /install.sh {
    default_type "text/x-shellscript; charset=utf-8";
    add_header Cache-Control "public, max-age=300";
  }
  location = /install.ps1 {
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=300";
  }
  # The public half of the key the releases and the images are signed with (docs/design/RELEASE.md, "Signing")
  location = /cosign.pub {
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=300";
  }

  # The documentation and the reference of the release's standard library, baked into the image of that release
  location /docs/ {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "public, max-age=300";
  }

  # release-sync writes /srv/torb/download/<version>/... and updates .../versions.txt and .../latest (a symlink); an
  # archive is immutable once written, an index file short-lived
  location /download/ {
    root /srv/torb;
    add_header Cache-Control "public, max-age=60";
  }
  # Never a hidden entry: release-sync downloads and verifies below .incoming/, sets a version's old directory aside as
  # .<version>.replaced and stages the next latest as .latest-<version> - nothing there is published, and nothing
  # unverified may ever be reachable. First among the regular expressions, so it wins over the one below
  location ~ ^/download/(.*/)?\. {
    return 404;
  }
  location ~ ^/download/(?!latest/|versions\.txt)[^/]+/ {
    root /srv/torb;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

# packages.torb.dev: the sparse index, the archives and the per-package documentation, all written by the registry's
# write service; /api is routed by Traefik to that service and never reaches this block
server {
  listen 80;
  server_name packages.torb.dev;
  root /srv/torb/registry;

  # An index file is appended to: short-lived, revalidated with the ETag nginx sends
  location /index/ {
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=60";
  }
  # A published archive is never replaced (section 7.3)
  location /archives/ {
    default_type "application/gzip";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /docs/ {
    add_header Cache-Control "public, max-age=300";
  }
  location / {
    return 404;
  }
}
