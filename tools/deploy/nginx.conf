# Read side of torb.dev and packages.torb.dev (tools/deploy/Dockerfile.static); Traefik terminates TLS in front of
# this and forwards both host names here, so there is no server_name split - the path alone tells /download/ (a
# torb.dev thing) from /index, /archives and /docs (packages.torb.dev, docs/design/RELEASE.md section 7.4).
server {
  listen 80;
  server_name _;

  location = /install.sh {
    root /usr/share/nginx/html;
    add_header Content-Type "text/x-shellscript; charset=utf-8";
  }
  location = /install.ps1 {
    root /usr/share/nginx/html;
    add_header Content-Type "text/plain; charset=utf-8";
  }

  # release-sync writes /srv/torb/download/<version>/... and updates .../versions.txt and .../latest (a symlink);
  # an archive is immutable once written, an index file short-lived - the CDN in front decides the exact lifetimes
  location /download/ {
    root /srv/torb;
    add_header Cache-Control "public, max-age=60";
  }
  location ~ ^/download/(?!latest|versions\.txt)[^/]+/ {
    root /srv/torb;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /index/ {
    root /srv/torb/registry;
    add_header Cache-Control "public, max-age=60";
  }
  location /archives/ {
    root /srv/torb/registry;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /docs/ {
    root /srv/torb/registry;
    add_header Cache-Control "public, max-age=300";
  }
}
