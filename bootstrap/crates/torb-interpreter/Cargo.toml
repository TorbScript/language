[package]
name = "torb-interpreter"
description = "Bootstrap interpreter: runs TorbScript directly from the syntax tree, without a type checker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torb-syntax = { path = "../torb-syntax" }

[features]
# The counters of `src/profile.rs`. Off by default so that they cost nothing; see "Performance" in bootstrap/README.md
profile = []

[lints]
workspace = true
