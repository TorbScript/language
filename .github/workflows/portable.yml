# The GitHub mirror's one workflow (docs/design/RELEASE.md, "The forge"): the repository lives on git.torb.dev, whose
# CI (.forgejo/workflows/) runs every gate on linux-x64 and publishes everything; GitHub receives every push through
# the forge's push mirror and runs only what the forge has no runner for yet - bootstrap, `check .`, the conformance
# suite and the runtime's tests on windows-x64, linux-arm64 and macos-arm64 - and whether the three agree on the C of
# every target (tools/agree.sh).
#
# And every morning (the `download` job): the newest nightly, installed from torb.dev on each of those machines and on
# linux-x64 with tools/install.sh or tools/install.ps1 - as a user installs it - and run. The forge has no runner for
# windows-x64, linux-arm64 and macos-arm64 and cross-compiles their archives (docs/design/RELEASE.md section 13,
# "Cross-compiled archives"); this is where those binaries first run on their own machines.
#
# It publishes nothing, reads no secret and needs no token: the seed comes from the forge's public release, the nightly
# from torb.dev. It runs only while the mirror is public, where GitHub's standard runners cost nothing; a private mirror
# would pay for macOS minutes at ten times the Linux rate. It is a report after the push, not a gate: main has moved on
# the forge already, and the nightly is published.
name: portable

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 0"
    # After the forge's nightly (02:17 UTC, then some hours of gates and publishing): the `download` job alone
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  TORB_BUILD_SLOTS: "1"

jobs:
  portable:
    name: bootstrap and conformance (${{ matrix.target }})
    if: github.event.repository.private == false && github.event.schedule != '23 9 * * *'
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-latest' || matrix.target == 'macos-arm64' && 'macos-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, linux-arm64, macos-arm64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.forgejo/actions/portable
        with:
          target: ${{ matrix.target }}
          save-cache: ${{ github.event_name == 'push' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agree-${{ matrix.target }}
          path: build/agree.txt
          retention-days: 30
          if-no-files-found: error

  agree:
    name: every host emits the same C
    if: always() && github.event.repository.private == false && github.event.schedule != '23 9 * * *'
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agree-*
          path: hosts
      - name: tools/agree.sh compare
        run: |
          set --
          for file in hosts/*/agree.txt; do
            [ -f "$file" ] || continue
            echo "== $file"
            cat "$file"
            set -- "$@" "$file"
          done
          [ $# -gt 0 ] || { echo "::error::no host emitted its list"; exit 1; }
          sh tools/agree.sh compare "$@"

  # The newest nightly as a user gets it: installed from torb.dev by the installer of the machine, then its version, a
  # check, a run in the VM and a native build with the machine's C compiler, in a directory outside any checkout. For
  # windows-x64, linux-arm64 and macos-arm64 the forge cross-compiles the archive (docs/design/RELEASE.md section 13,
  # "Cross-compiled archives"), and this is the first time that binary runs on its own machine; linux-x64 is here for
  # the installer. A report after the nightly is published, not a gate.
  download:
    name: the newest nightly, installed (${{ matrix.target }})
    if: >-
      github.event.repository.private == false
      && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 9 * * *')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TORB_INSTALL_CHANNEL: nightly
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # For `torb build`: gcc of MSYS2 on Windows (the machine's clang targets MSVC), gcc on Linux, clang on macOS
      - uses: ./.forgejo/actions/c-compiler
        with:
          target: ${{ matrix.target }}
      - name: sh tools/install.sh
        if: runner.os != 'Windows'
        run: |
          sh tools/install.sh
          echo "$HOME/.torb/bin" >>"$GITHUB_PATH"
      - name: tools/install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/install.ps1
          Join-Path $env:LOCALAPPDATA 'Programs\torb\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: check, run in the VM, build natively
        run: |
          mkdir -p "$RUNNER_TEMP/somewhere"
          cd "$RUNNER_TEMP/somewhere"
          cat >hello.trb <<'EOF'
          const names = ["seed", "fixpoint", "release"]
          for name in names {
            print "hello, {name}"
          }
          EOF
          expected=$(printf 'hello, seed\nhello, fixpoint\nhello, release')
          torb --version
          torb check hello.trb
          [ "$(torb run hello.trb)" = "$expected" ] || { echo "::error::torb run printed something else"; exit 1; }
          torb build hello.trb --output out/hello
          [ "$(out/hello)" = "$expected" ] || { echo "::error::the built program printed something else"; exit 1; }
          echo "the nightly's torb checks, runs and builds on ${{ matrix.target }}"
