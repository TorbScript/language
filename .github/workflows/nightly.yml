# The nightly channel (docs/design/RELEASE.md section 5): every night that main has changed, the gates on every tier 1
# target, and then
#
#   - the seed of main, published to the `seeds` release, once linux-x64 passes tier A and tier B
#     (the seed does not wait for the other targets: it is C, the same on every target)
#   - a prerelease `nightly-YYYYMMDD` with the archives of every target, the source, the seed, SHA256SUMS and its
#     Sigstore signature, once every target is green
#   - the nightlies older than 30 days are deleted, with their tags
#
# Only main is ever published: the schedule runs on the default branch, and a manual run from another branch runs the
# gates and publishes nothing.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: has main changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version="nightly-$(date -u +%Y%m%d)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # The commits the nightlies were built from; a scheduled run of a commit that already has one does nothing
          built=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/nightly-" --jq '.[].object.sha' 2>/dev/null || true)
          if [ "$EVENT" = "schedule" ] && printf '%s\n' "$built" | grep -q -x "$COMMIT"; then
            echo "main is still $COMMIT, which has a nightly already"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

  gates:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/gates.yml
    with:
      tier-b: true
      seed: true
      package: true
      version: ${{ needs.plan.outputs.version }}

  seed:
    name: publish the seed
    needs: gates
    # The seed artifact exists exactly when linux-x64 passed tier A and tier B, whatever the other targets did
    if: always() && github.ref == 'refs/heads/main' && needs.gates.result != 'skipped' && needs.gates.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seeds
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seed
          path: seed-archive
      - name: sh tools/publish-seed.sh
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TORB_SEED_REPOSITORY: ${{ github.repository }}
        run: |
          for archive in seed-archive/torb-seed-*.tar.gz; do
            sh tools/publish-seed.sh "$archive"
          done
      - name: No seed tonight
        if: steps.download.outcome != 'success'
        run: echo "::warning::linux-x64 did not pass tier A and tier B, so no seed was packed and none was published"

  publish:
    name: publish the nightly
    needs: [plan, gates]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The Sigstore certificate is issued for this job's OIDC identity; nothing else in the repository gets one
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: The prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          # A second run on the same day replaces that day's nightly
          if gh release view "$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$VERSION" --repo "$REPOSITORY" --cleanup-tag --yes
          fi
          identity="https://github.com/${WORKFLOW%@*}@refs/heads/main"
          cat >notes.md <<EOF
          The nightly of main at $COMMIT: tier A and tier B green on linux-x64, bootstrap and conformance green on every
          tier 1 target. Not a release: nothing about it is promised, and it is deleted after 30 days.

          Verify a download:

              cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity "$identity" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
              sha256sum --check --ignore-missing SHA256SUMS
          EOF
          gh release create "$VERSION" --repo "$REPOSITORY" --target "$COMMIT" --prerelease --latest=false \
            --title "Nightly $(date -u +%Y-%m-%d)" --notes-file notes.md dist/*
      - name: Delete the nightlies older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          gh release list --repo "$REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            grep -E '^nightly-[0-9]{8}$' | while IFS= read -r tag; do
              if [ "${tag#nightly-}" -lt "$cutoff" ]; then
                echo "deleting $tag"
                gh release delete "$tag" --repo "$REPOSITORY" --cleanup-tag --yes
              fi
            done
