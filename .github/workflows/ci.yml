# Every push to main and every pull request: the gates (gates.yml) on the targets the change can affect.
#
# - linux-x64 bootstraps from a published seed and runs tier A, always.
# - Tier B runs on every push to main, and on a pull request that touches compiler/src/ir, compiler/src/backend,
#   runtime/, tools/ or .github/ - the rule of compiler/CONTRIBUTING.md.
# - windows-x64 (the maintainer's own platform, and the one every seed so far was built on) bootstraps and runs the
#   conformance suite, always.
# - linux-arm64 and macos-arm64 do the same on every change of a public repository. While the repository is private,
#   where a macOS minute is billed as ten, they run only for a change that touches runtime/, compiler/src/backend,
#   tools/ or .github/ - the code that differs per machine - and every night (nightly.yml) and for every release.
#
# A pull request only reads: its token is read-only, it restores the caches and never writes them, and nothing of it
# runs with a secret. A newer push to the same branch or pull request cancels the run it supersedes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_OF_PULL: ${{ github.event.pull_request.head.sha }}
        run: |
          # What the push or the pull request adds: linear, and every subject a Conventional Commit
          if [ "$EVENT" = "pull_request" ]; then
            sh tools/check-commits.sh "$BASE" "$HEAD_OF_PULL"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            sh tools/check-commits.sh "$BEFORE" HEAD
          else
            echo "a new branch or a force push: there is no earlier commit to compare against"
          fi

  scope:
    name: what the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier-b: ${{ steps.scope.outputs.tier-b }}
      portable: ${{ steps.scope.outputs.portable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # The files the change touches; unknown (a new branch, a force push) counts as everything
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "*")
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
          else
            changed="*"
          fi
          printf '%s\n' "$changed"
          touches() {
            printf '%s\n' "$changed" | grep -q -E "^(\*|$1)"
          }
          if [ "$EVENT" = "push" ] || touches 'compiler/src/ir/|compiler/src/backend/|runtime/|tools/|\.github/'; then
            echo "tier-b=true" >>"$GITHUB_OUTPUT"
          else
            echo "tier-b=false" >>"$GITHUB_OUTPUT"
          fi
          if [ "$PRIVATE" != "true" ] || touches 'runtime/|compiler/src/backend/|tools/|\.github/'; then
            echo 'portable=["windows-x64", "linux-arm64", "macos-arm64"]' >>"$GITHUB_OUTPUT"
          else
            echo 'portable=["windows-x64"]' >>"$GITHUB_OUTPUT"
          fi

  gates:
    needs: scope
    uses: ./.github/workflows/gates.yml
    with:
      portable: ${{ needs.scope.outputs.portable }}
      tier-b: ${{ needs.scope.outputs.tier-b == 'true' }}
      save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
