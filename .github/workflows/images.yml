# The container images of the root server (docs/design/RELEASE.md section 7.11), called by `release` and `nightly`
# once their release is published: ghcr.io/torbscript/release-sync, ghcr.io/torbscript/site and
# ghcr.io/torbscript/registry, each for linux/amd64 and linux/arm64, built from the release's own assets (the `dist`
# artifact: the Linux toolchains and the source archive) and never from a checkout, signed with cosign (keyless, this
# workflow's OIDC identity), with the OCI labels that link them to the repository.
#
#   stable    <version> and latest       (release.yml)
#   nightly   nightly-YYYYMMDD and nightly (nightly.yml)
#
# The GITHUB_TOKEN pushes (`packages: write`); a first push creates the package on GHCR, linked to this repository by
# the `org.opencontainers.image.source` label. Verifying an image:
#
#   cosign verify ghcr.io/torbscript/registry:0.2.0 \
#     --certificate-identity-regexp '^https://github.com/TorbScript/language/.github/workflows/images.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: images

on:
  workflow_call:
    inputs:
      version:
        description: The release's version, which names its assets (0.2.0, nightly-20260927)
        required: true
        type: string
      channel:
        description: stable or nightly
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: ghcr.io/torbscript/${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [release-sync, site, registry]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: The tags and labels
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          IMAGE: ${{ matrix.image }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          name="ghcr.io/torbscript/$IMAGE"
          case "$CHANNEL" in
            stable) tags="$name:$VERSION,$name:latest" ;;
            nightly) tags="$name:$VERSION,$name:nightly" ;;
            *) echo "::error::the channel is stable or nightly, not $CHANNEL"; exit 1 ;;
          esac
          {
            echo "name=$name"
            echo "tags=$tags"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/$REPOSITORY"
            echo "org.opencontainers.image.revision=$COMMIT"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.licenses=MIT"
            echo "org.opencontainers.image.url=https://torb.dev"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          ls dist/torb-"$VERSION"-source.tar.gz dist/torb-"$VERSION"-linux-x64.tar.gz dist/torb-"$VERSION"-linux-arm64.tar.gz
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: tools/deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          push: true
          provenance: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, this workflow's identity)
        env:
          NAME: ${{ steps.tags.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$NAME@$DIGEST"
