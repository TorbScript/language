# The stable channel (docs/design/RELEASE.md sections 3 to 5 and 13): pushing a tag `v0.MINOR.PATCH` - and nothing
# else - makes a release.
#
#   1. check      the tag is a version, it equals the `version` of project.trb and compiler/project.trb, its commit is
#                 on main, and a public repository has a LICENSE
#   2. gates      every gate on every tier 1 target (gates.yml), the release binaries, the archives, the seed
#   3. publish    SHA256SUMS signed with Sigstore (keyless, this job's OIDC identity), the GitHub release with every
#                 archive, the source, the seed and the signature, and the seed added to the `seeds` index
#   4. images     the root server's container images from the release's assets, pushed to GHCR and signed
#                 (images.yml), and the package manager channels (publish-packages)
#
# A red gate anywhere stops the release before anything is published. Nothing here runs for a pull request: the only
# trigger is a tag, which only somebody with write access can push. The jobs with write permissions are `publish`,
# which runs no code of the repository except tools/publish-seed.sh from the tagged commit, and `images`, which may
# write packages and builds from the assets `publish` released.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: the tag is a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          version=${TAG#v}
          case "$version" in
            0.*) ;;
            *)
              echo "::error::before 1.0 a release is 0.MINOR.PATCH (docs/design/RELEASE.md section 3), not $version"
              exit 1
              ;;
          esac
          printf '%s\n' "$version" | grep -q -E '^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo "::error::$TAG is not v0.MINOR.PATCH without leading zeros"
            exit 1
          }
          # The download, the manifests and the documentation carry one number (RELEASE.md section 3)
          for manifest in project.trb compiler/project.trb; do
            declared=$(sed -n 's/^version "\(.*\)"$/\1/p' "$manifest" | tr -d '\r')
            if [ "$declared" != "$version" ]; then
              echo "::error file=$manifest::says version \"$declared\", and the tag is $TAG"
              exit 1
            fi
          done
          # fetch-depth 0 fetched every branch, main among them
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not a commit of main"
            exit 1
          fi
          # RELEASE.md section 9: without a license nobody may use it, so nothing public is released without one. A
          # private repository may cut test releases (RELEASE.md section 10, slice 7).
          if [ "$PRIVATE" != "true" ] && ! ls LICENSE* >/dev/null 2>&1; then
            echo "::error::a public release needs a LICENSE file at the root"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  gates:
    needs: check
    uses: ./.github/workflows/gates.yml
    with:
      tier-b: true
      seed: true
      package: true
      version: ${{ needs.check.outputs.version }}

  publish:
    name: publish the release
    needs: [check, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A deployment environment: required reviewers set on it in the repository's settings hold the release until one
    # of them approves, after every gate is green
    environment: release
    concurrency:
      group: seeds
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          identity="https://github.com/${WORKFLOW%@*}@refs/tags/$TAG"
          notes="docs/releases/$VERSION.md"
          {
            if [ -f "$notes" ]; then
              cat "$notes"
            else
              echo "TorbScript $VERSION."
            fi
            echo ""
            echo "## Verifying a download"
            echo ""
            echo '```sh'
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity \"$identity\" \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS"
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo '```'
          } >release-notes.md
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "TorbScript $VERSION" \
            --notes-file release-notes.md dist/*
      - name: The seed of the release, in the seeds index
        env:
          GH_TOKEN: ${{ github.token }}
          TORB_SEED_REPOSITORY: ${{ github.repository }}
        run: |
          for archive in dist/torb-seed-*.tar.gz; do
            sh tools/publish-seed.sh "$archive"
          done

  images:
    name: container images (docs/design/RELEASE.md section 7.11)
    needs: [check, publish]
    # The images are built from the release's own assets, so they wait for the release; `images.yml` pushes them to
    # GHCR tagged <version> and latest, and signs them with this run's identity
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.check.outputs.version }}
      channel: stable

  publish-packages:
    name: package manager channels (docs/design/RELEASE.md section 5)
    needs: [check, gates, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same environment as `publish`: required reviewers already approved the release itself before this runs
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Render Formula/torb.rb and bucket/torb.json from SHA256SUMS
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: sh tools/render-package-manifests.sh "$VERSION" "$REPOSITORY" dist rendered
      # Each of the three below needs a fine-grained token limited to the one repository it pushes to or opens a pull
      # request against (docs/contributing/releasing.md, "one-time setup"). The `secrets` context cannot be read in a
      # step's `if:` (GitHub Actions), so each step is always run and skips itself, in its own script, where its
      # token is empty - a channel nobody has set up yet never holds back the release itself.
      - name: Push Formula/torb.rb to TorbScript/homebrew-tap
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set - skipping"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/TorbScript/homebrew-tap" tap
          cp rendered/Formula/torb.rb tap/Formula/torb.rb
          cd tap
          git -c user.name="torbscript-release" -c user.email="release@torb.dev" commit -am "torb $VERSION" || exit 0
          git push
      - name: Push bucket/torb.json to TorbScript/scoop-bucket
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SCOOP_BUCKET_TOKEN is not set - skipping"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/TorbScript/scoop-bucket" bucket
          mkdir -p bucket/bucket
          cp rendered/bucket/torb.json bucket/bucket/torb.json
          cd bucket
          git -c user.name="torbscript-release" -c user.email="release@torb.dev" commit -am "torb $VERSION" || exit 0
          git push
      - name: A winget pull request via wingetcreate
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WINGET_TOKEN is not set - skipping"
            exit 0
          fi
          dotnet tool install --global wingetcreate
          wingetcreate update TorbScript.Torb --version "$VERSION" \
            --urls "https://github.com/$REPOSITORY/releases/download/v$VERSION/torb-$VERSION-windows-x64.zip" \
            --submit --token "$TOKEN"
